<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pasaporte Feria del Colegio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primario: #1B3B6F;
    --color-secundario: #2E7D32;
    --color-acento: #E8702A;
    --color-fondo: #F4F6F9;
    --color-texto: #22303F;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--color-fondo);
    color: var(--color-texto);
    margin: 0;
    padding: 20px 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tarjeta {
    background: #fff;
    border-radius: 20px;
    border: 3px solid var(--color-primario);
    box-shadow: 0 0 0 6px #EAF1FF, 0 6px 20px rgba(27,59,111,0.15);
    padding: 36px 24px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .barra-superior {
    height: 6px;
    width: 70px;
    background: linear-gradient(90deg, var(--color-primario), var(--color-secundario), var(--color-acento));
    border-radius: 4px;
    margin: 0 auto 22px;
  }
  h2 {
    margin: 0 0 6px;
    color: var(--color-primario);
    font-size: 27px;
    font-family: 'Baloo 2', 'Quicksand', sans-serif;
    font-weight: 700;
  }
  .subtitulo { color: #667; font-size: 16px; margin-top: 4px; }
  .etiqueta-campo {
    display: block; text-align: left; font-size: 13px; font-weight: 600;
    color: #667; margin: 14px 0 4px;
  }
  .input-telefono {
    font-size: 20px; padding: 14px 16px; width: 100%;
    border: 1.5px solid #D5DCE5; border-radius: 12px; margin: 10px 0;
    outline: none; display: block; font-family: inherit;
  }
  .input-telefono:focus { border-color: var(--color-primario); }
  .boton-principal {
    font-family: 'Baloo 2', 'Quicksand', sans-serif;
    font-size: 19px; font-weight: 700; padding: 14px 32px; border: none;
    border-radius: 12px; background: var(--color-primario); color: #fff;
    cursor: pointer; width: 100%; max-width: 260px; margin-top: 12px;
  }
  .boton-principal:active { opacity: 0.85; }
  .boton-principal:disabled { opacity: 0.75; cursor: default; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.5); border-top-color: #fff;
    border-radius: 50%; vertical-align: -2px; margin-right: 6px;
    animation: girar 0.7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  .boton-secundario {
    font-size: 15px; font-weight: 600; padding: 10px 20px;
    border: 1.5px solid var(--color-primario); border-radius: 10px;
    background: #fff; color: var(--color-primario); cursor: pointer; margin-top: 10px;
  }
  .aviso { background: #FDF1E7; color: #9C4B14; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  .exito { background: #EAF6EC; color: #1E5A28; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  .error-carga { background: #FDECEA; color: #9C2A1E; padding: 10px 12px; border-radius: 10px; font-size: 14px; text-align: left; white-space: pre-wrap; }
  .contador { font-size: 15px; color: var(--color-primario); }
  .ubicacion {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    color: #555; font-size: 14px; background: #F0F3F7; padding: 8px 10px; border-radius: 8px;
  }
  .ubicacion svg { flex-shrink: 0; color: #D62839; }
  p { line-height: 1.4; }

  @keyframes stampIn {
    0%   { transform: scale(3) rotate(-25deg); opacity: 0; }
    55%  { transform: scale(0.9) rotate(-6deg); opacity: 1; }
    75%  { transform: scale(1.08) rotate(-11deg); }
    100% { transform: scale(1) rotate(-9deg); opacity: 1; }
  }

  .pasaporte { display: grid; gap: 10px; margin: 4px 0 20px; }
  .casillero {
    aspect-ratio: 1 / 1; border-radius: 14px; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  .casillero.vacio {
    border: 2px dashed #C5CEDA; background: #FAFBFC; color: #B0BAC8;
    font-size: 24px; font-weight: 700;
  }
  .casillero.lleno { border: 2px solid var(--color-secundario); background: #EAF6EC; }
  .casillero.lleno img { width: 100%; height: 100%; object-fit: contain; }
  .casillero .check { font-size: 30px; font-weight: 800; color: var(--color-secundario); }
  .casillero.nuevo { animation: stampIn 0.55s cubic-bezier(.36,1.7,.4,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .casillero.nuevo { animation: none; }
    .spinner { animation: none; }
  }

  #confetti-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }
  .confeti {
    position: absolute;
    top: -12px;
    width: 9px;
    height: 14px;
    opacity: 0.95;
    animation-name: caer;
    animation-timing-function: cubic-bezier(.36,.1,.6,.9);
    animation-fill-mode: forwards;
  }
  @keyframes caer {
    to { transform: translateY(110vh) rotate(var(--giro)); opacity: 0.9; }
  }
</style>
</head>
<body>
  <div id="confetti-overlay"></div>
  <div class="tarjeta" id="tarjeta">
    <img class="logo" id="logo" src="img/logo.jpg" alt="Logo" onerror="this.style.display='none'">
    <div class="barra-superior" id="barraSuperior"></div>
    <div id="contenido">
      <p class="subtitulo">Cargando...</p>
    </div>
  </div>

<script>
/* =========================================================================
 * CONFIGURACIÓN — pegá acá la URL de tu deploy de Apps Script (termina en /exec)
 * ========================================================================= */
const API_URL = "PEGA_ACA_TU_URL_DE_APPS_SCRIPT/exec";

/* Imágenes de sello por punto. Poné los archivos en site/img/ con estos
 * nombres, o cambiá las rutas acá. Si un punto no tiene imagen, se muestra
 * un ✓ verde en su casillero. */
const IMAGENES_SELLO = {
  1: "img/sello-1.jpg",
  2: "img/sello-2.jpg",
  3: "img/sello-3.jpg",
  4: "img/sello-4.jpg"
};

const ICONO_UBICACION = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;

const contenido = document.getElementById("contenido");
const tarjeta = document.getElementById("tarjeta");
const params = new URLSearchParams(window.location.search);
const punto = parseInt(params.get("punto"), 10);

let CONFIG = null;

init();

async function init() {
  if (!punto || punto < 1) {
    contenido.innerHTML = `<p>Este código QR no es válido. Avisá a un organizador.</p>`;
    return;
  }

  try {
    const res = await fetch(`${API_URL}?action=config`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "No se pudo cargar la configuración.");
    CONFIG = data;

    if (punto > CONFIG.totalPuntos) {
      contenido.innerHTML = `<p>Este código QR no es válido. Avisá a un organizador.</p>`;
      return;
    }

    renderFormulario();
  } catch (err) {
    contenido.innerHTML = `<p class="error-carga">No se pudo conectar con el servidor.\n\n${escapeHtml(err.message)}</p>
      <button type="button" class="boton-secundario" onclick="location.reload()">Reintentar</button>`;
  }
}

function nombrePunto(p) {
  return (CONFIG.nombresPuntos && CONFIG.nombresPuntos[p]) || ("Punto " + p);
}

function mensajeUbicacion(p) {
  return (CONFIG.mensajesUbicacion && CONFIG.mensajesUbicacion[p]) || "";
}

function renderFormulario() {
  const esPrimerPunto = punto === 1;
  contenido.innerHTML = `
    <h2>${nombrePunto(punto)}</h2>
    <p class="subtitulo">${esPrimerPunto ? "Ingresá tus datos para empezar tu pasaporte." : "Ingresá tu número de teléfono para sellar tu pasaporte."}</p>
    <form id="formSello">
      <label class="etiqueta-campo" for="campoTelefono">Número de teléfono</label>
      <input id="campoTelefono" type="tel" name="telefono" placeholder="Ej: 1122334455" required
             inputmode="numeric" pattern="[0-9]*" maxlength="12" class="input-telefono"
             oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,12)">
      ${esPrimerPunto ? `
      <label class="etiqueta-campo" for="campoNombre">Nombre y apellido</label>
      <input id="campoNombre" type="text" name="nombre" placeholder="Ej: Juan Pérez" required
             maxlength="30" class="input-telefono"
             oninput="this.value=this.value.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ\\s]/g,'').slice(0,30)">` : ""}
      <button type="submit" id="btnSellar" class="boton-principal">Sellar</button>
    </form>
  `;
  document.getElementById("formSello").addEventListener("submit", onSubmitFormulario);
}

async function onSubmitFormulario(ev) {
  ev.preventDefault();
  const telefono = document.getElementById("campoTelefono").value.trim();
  const nombreEl = document.getElementById("campoNombre");
  const nombre = nombreEl ? nombreEl.value.trim() : "";

  const btn = document.getElementById("btnSellar");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Procesando...`;

  try {
    const qs = new URLSearchParams({ action: "sellar", punto: String(punto), telefono });
    if (nombre) qs.set("nombre", nombre);

    const res = await fetch(`${API_URL}?${qs.toString()}`);
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    renderResultado(data);
  } catch (err) {
    contenido.innerHTML = `<p class="error-carga">No se pudo procesar el sello.\n\n${escapeHtml(err.message)}</p>
      <button type="button" class="boton-secundario" onclick="location.reload()">Volver a intentar</button>`;
  }
}

function primerNombre(nombreCompleto) {
  if (!nombreCompleto) return "";
  return String(nombreCompleto).trim().split(/\s+/)[0];
}

function elegirAlAzar(opciones) {
  return opciones[Math.floor(Math.random() * opciones.length)];
}

function renderPasaporte(sellos, puntoNuevo) {
  let html = `<div class="pasaporte" style="grid-template-columns:repeat(${CONFIG.totalPuntos},1fr);">`;
  sellos.forEach((lleno, i) => {
    const p = i + 1;
    if (lleno) {
      const esNuevo = p === puntoNuevo;
      const src = IMAGENES_SELLO[p];
      const contenidoCasillero = src
        ? `<img src="${src}" alt="Sello ${p}" onerror="this.parentElement.innerHTML='<span class=&quot;check&quot;>✓</span>'">`
        : `<span class="check">✓</span>`;
      html += `<div class="casillero lleno${esNuevo ? " nuevo" : ""}">${contenidoCasillero}</div>`;
    } else {
      html += `<div class="casillero vacio"><span>${p}</span></div>`;
    }
  });
  return html + `</div>`;
}

function reproducirSonidoAcierto() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = ctx.currentTime;
    function nota(frecuencia, inicio, duracion, volumen) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(frecuencia, ahora + inicio);
      gain.gain.setValueAtTime(0, ahora + inicio);
      gain.gain.linearRampToValueAtTime(volumen, ahora + inicio + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + inicio + duracion);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ahora + inicio);
      osc.stop(ahora + inicio + duracion + 0.05);
    }
    nota(523.25, 0.00, 0.12, 0.18);
    nota(659.25, 0.09, 0.12, 0.18);
    nota(783.99, 0.18, 0.20, 0.20);
  } catch (e) { /* si el navegador bloquea el audio automático, no pasa nada */ }
}

// Aplausos generados por código (ruido filtrado en ráfagas cortas), sin
// depender de ningún archivo de audio externo.
function reproducirAplausos() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = ctx.currentTime;
    const duracionTotal = 1.6;
    const cantidadPalmas = 28;

    for (let i = 0; i < cantidadPalmas; i++) {
      const inicio = Math.random() * duracionTotal;
      const largoBuffer = 0.04;
      const buffer = ctx.createBuffer(1, ctx.sampleRate * largoBuffer, ctx.sampleRate);
      const datos = buffer.getChannelData(0);
      for (let j = 0; j < datos.length; j++) {
        datos[j] = (Math.random() * 2 - 1) * (1 - j / datos.length);
      }
      const fuente = ctx.createBufferSource();
      fuente.buffer = buffer;

      const filtro = ctx.createBiquadFilter();
      filtro.type = "bandpass";
      filtro.frequency.value = 1500 + Math.random() * 2500;
      filtro.Q.value = 0.7;

      const gain = ctx.createGain();
      const volumen = 0.35 + Math.random() * 0.25;
      gain.gain.setValueAtTime(volumen, ahora + inicio);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + inicio + largoBuffer);

      fuente.connect(filtro).connect(gain).connect(ctx.destination);
      fuente.start(ahora + inicio);
    }
  } catch (e) { /* si el navegador bloquea el audio automático, no pasa nada */ }
}

function lanzarConfeti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const overlay = document.getElementById("confetti-overlay");
  const colores = ["#1B3B6F", "#2E7D32", "#E8702A", "#F4C542", "#D62839"];
  const cantidad = 70;

  for (let i = 0; i < cantidad; i++) {
    const pieza = document.createElement("div");
    pieza.className = "confeti";
    pieza.style.left = Math.random() * 100 + "vw";
    pieza.style.background = colores[Math.floor(Math.random() * colores.length)];
    pieza.style.setProperty("--giro", (Math.random() * 720 - 360) + "deg");
    const duracion = 2.4 + Math.random() * 1.6;
    const demora = Math.random() * 0.5;
    pieza.style.animationDuration = duracion + "s";
    pieza.style.animationDelay = demora + "s";
    if (Math.random() > 0.5) pieza.style.borderRadius = "50%";
    overlay.appendChild(pieza);
    setTimeout(() => pieza.remove(), (duracion + demora) * 1000 + 200);
  }
}

function ocultarEncabezado() {
  document.getElementById("logo").style.display = "none";
  document.getElementById("barraSuperior").style.display = "none";
}

function renderResultado(r) {
  const nombreActual = nombrePunto(punto);
  const nombreCorto = primerNombre(r.nombre);
  const saludo = nombreCorto ? (nombreCorto + ", ") : "";
  let html = "";

  if (!r.ok) {
    html += renderPasaporte(r.sellos, null);
    const nombrePendiente = nombrePunto(r.puntoPendiente);
    const ubic = mensajeUbicacion(r.puntoPendiente);
    const lineaUbicacion = ubic ? `<p class="ubicacion">${ICONO_UBICACION}${ubic}</p>` : "";

    if (r.motivo === "debe_empezar_por_1") {
      const opciones = [
        `¡Epa! Todavía no arrancaste tu pasaporte. Empezá por el <b>${nombrePunto(1)}</b> para sumar tu primer sello 🚀`,
        `Che, para jugar necesitás arrancar por el <b>${nombrePunto(1)}</b> 😉`,
        `¡Casi! Tu aventura empieza en el <b>${nombrePunto(1)}</b>`
      ];
      html += `<p class="aviso">${elegirAlAzar(opciones)}</p>${lineaUbicacion}`;
    } else if (r.motivo === "ya_tenia_este_punto") {
      const opciones = [
        `¡Ese ya lo tenés guardado! 😄 Seguí para el <b>${nombrePendiente}</b>`,
        `¡Recontra sellado! Ahora vamos por el <b>${nombrePendiente}</b>`,
        `Ya está esa, tranqui. Te toca el <b>${nombrePendiente}</b>`
      ];
      html += `<p class="aviso">${saludo}${elegirAlAzar(opciones)}</p>${lineaUbicacion}`;
    } else if (r.motivo === "orden_incorrecto") {
      const opciones = [
        `¡Casi! Pero primero tenés que pasar por el <b>${nombrePendiente}</b>`,
        `Un pasito antes: te espera el <b>${nombrePendiente}</b>`,
        `¡Epa, en orden! Primero el <b>${nombrePendiente}</b> y después seguimos`
      ];
      html += `<p class="aviso">${saludo}${elegirAlAzar(opciones)}</p>${lineaUbicacion}`;
    }
    html += `<button type="button" class="boton-secundario" onclick="location.reload()">Volver a intentar</button>`;
    contenido.innerHTML = html;
    return;
  }

  const mensajeFinal = (CONFIG.mensajeFinal && CONFIG.mensajeFinal.trim())
    ? CONFIG.mensajeFinal.trim()
    : "Ya estás anotado/a en el sorteo.";

  if (r.yaEstabaCompletoAntes) {
    html += renderPasaporte(r.sellos, null);
    html += `<p class="exito">🎉 ${saludo}ya habías completado todo el recorrido. ${mensajeFinal}</p>`;
    contenido.innerHTML = html;
    return;
  }

  html += renderPasaporte(r.sellos, r.puntoRecienGuardado);
  html += `<p class="exito">✅ ${saludo}¡sello de <b>${nombreActual}</b> registrado!</p>`;
  html += `<p class="contador">Llevás <b>${r.totalSellos} de ${CONFIG.totalPuntos}</b> sellos.</p>`;

  if (r.completo) {
    html += r.anotadoAhora
      ? `<p class="exito">🎉 ¡Completaste el recorrido! ${mensajeFinal}</p>`
      : `<p class="exito">🎉 ${mensajeFinal}</p>`;
  } else {
    const faltan = CONFIG.totalPuntos - r.totalSellos;
    if (faltan === 1) {
      html += `<p>¡Último esfuerzo! Un sello más y estás adentro del sorteo 🎯</p>`;
    } else {
      const opciones = [
        "¡Genial! Vas con todo 💪",
        "¡Vamos que ya casi lo tenés!",
        "¡Excelente! Un sello más en el bolsillo",
        "¡Así se hace! Seguí para adelante",
        "¡Buenísimo! Cada vez más cerca del sorteo"
      ];
      html += `<p>${elegirAlAzar(opciones)}</p>`;
    }
    const proximoPendiente = r.puntoRecienGuardado ? r.puntoRecienGuardado + 1 : null;
    if (proximoPendiente && proximoPendiente <= CONFIG.totalPuntos) {
      const ubic = mensajeUbicacion(proximoPendiente);
      if (ubic) {
        html += `<p>Tu próxima parada: <b>${nombrePunto(proximoPendiente)}</b></p>`;
        html += `<p class="ubicacion">${ICONO_UBICACION}${ubic}</p>`;
      }
    }
  }

  contenido.innerHTML = html;
  ocultarEncabezado();

  if (r.completo) {
    lanzarConfeti();
    reproducirAplausos();
  } else {
    reproducirSonidoAcierto();
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
